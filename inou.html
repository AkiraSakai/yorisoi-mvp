<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ヨリソイ／ナラティブGPS ― 異能の掛け算分析</title>
<style>
  :root {
    --cp-bg: #0f0f12;
    --cp-surface: #17171c;
    --cp-surface-2: #1f1f27;
    --cp-border: #2c2c36;
    --cp-text: #ececf1;
    --cp-text-dim: #a0a0ad;
    --cp-accent: #b11f4b;
    --cp-accent-soft: rgba(177, 31, 75, 0.16);
    --cp-good: #3fae6b;
    --cp-warn: #e0a23c;
    --cp-bad: #d6543f;
    --cp-radius: 14px;
    --cp-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  [data-theme="light"] {
    --cp-bg: #f4f4f7;
    --cp-surface: #ffffff;
    --cp-surface-2: #f0f0f4;
    --cp-border: #dcdce4;
    --cp-text: #1a1a22;
    --cp-text-dim: #5a5a68;
    --cp-accent: #b11f4b;
    --cp-accent-soft: rgba(177, 31, 75, 0.10);
    --cp-good: #2f8f54;
    --cp-warn: #b9802a;
    --cp-bad: #c0432f;
    --cp-shadow: 0 8px 30px rgba(0,0,0,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", system-ui, sans-serif;
    background: var(--cp-bg);
    color: var(--cp-text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #deck { height: 100vh; width: 100vw; position: relative; }
  .slide {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    padding: clamp(24px, 5vw, 72px);
    overflow-y: auto;
    animation: fade .35s ease;
  }
  .slide.active { display: flex; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none; } }

  .kicker {
    color: var(--cp-accent);
    font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    font-size: clamp(11px, 1.1vw, 13px); margin-bottom: 10px;
  }
  h1 { font-size: clamp(30px, 5vw, 60px); line-height: 1.12; font-weight: 800; }
  h2 { font-size: clamp(22px, 3.2vw, 40px); line-height: 1.18; font-weight: 800; margin-bottom: 6px; }
  .sub { color: var(--cp-text-dim); font-size: clamp(14px, 1.6vw, 20px); margin-top: 12px; }
  .lead { font-size: clamp(15px, 1.7vw, 21px); line-height: 1.6; }

  .grid { display: grid; gap: 16px; margin-top: 22px; }
  .g2 { grid-template-columns: repeat(2, 1fr); }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 820px){ .g2,.g3,.g4{ grid-template-columns: 1fr; } }

  .card {
    background: var(--cp-surface);
    border: 1px solid var(--cp-border);
    border-radius: var(--cp-radius);
    padding: 18px 20px;
    box-shadow: var(--cp-shadow);
  }
  .card h3 { font-size: clamp(15px,1.5vw,18px); margin-bottom: 8px; }
  .card p { color: var(--cp-text-dim); font-size: clamp(13px,1.3vw,15px); line-height: 1.55; }
  .tag {
    display: inline-block; font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 999px;
    background: var(--cp-accent-soft); color: var(--cp-accent);
    border: 1px solid var(--cp-accent); margin-bottom: 8px;
  }

  ul.clean { list-style: none; display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  ul.clean li {
    background: var(--cp-surface); border: 1px solid var(--cp-border);
    border-left: 4px solid var(--cp-accent);
    border-radius: 10px; padding: 14px 18px; font-size: clamp(14px,1.5vw,17px); line-height: 1.5;
  }
  ul.clean li b { color: var(--cp-text); }

  /* BTC bars */
  .btc-row { display: grid; grid-template-columns: 90px 1fr 64px; align-items: center; gap: 14px; margin: 10px 0; }
  .btc-label { font-weight: 800; font-size: 18px; }
  .btc-track { display:block; height: 16px; background: var(--cp-surface-2); border-radius: 999px; overflow: hidden; border:1px solid var(--cp-border); }
  .btc-fill { display:block; height: 100%; border-radius: 999px; transition: width .4s ease; }
  .btc-num { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }

  /* rating chips */
  .r { font-weight: 800; border-radius: 6px; padding: 1px 8px; font-size: 13px; display:inline-block; min-width: 26px; text-align:center; }
  .r.O { color: #fff; background: var(--cp-good); }
  .r.△ { color: #1a1a22; background: var(--cp-warn); }
  .r.x, .r.✕ { color: #fff; background: var(--cp-bad); }

  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: clamp(12px,1.25vw,14.5px); }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--cp-border); vertical-align: top; }
  th { color: var(--cp-text-dim); font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  td.c { width: 44px; text-align:center; }

  .stage-h { color: var(--cp-accent); font-weight: 800; margin: 18px 0 4px; font-size: clamp(14px,1.5vw,16px); }

  /* roadmap */
  .road { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-top: 22px; }
  @media (max-width:820px){ .road{ grid-template-columns:1fr; } }
  .road .card h3 { color: var(--cp-accent); }
  .road ol { margin: 8px 0 0 18px; color: var(--cp-text-dim); font-size: clamp(13px,1.3vw,15px); line-height: 1.6; }

  .big-stat { font-size: clamp(40px,7vw,86px); font-weight: 800; color: var(--cp-accent); line-height: 1; }
  .stat-cap { color: var(--cp-text-dim); margin-top: 6px; font-size: clamp(13px,1.4vw,16px); }

  /* nav */
  .nav {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; z-index: 50;
    background: var(--cp-surface); border: 1px solid var(--cp-border);
    border-radius: 999px; padding: 8px 16px; box-shadow: var(--cp-shadow);
  }
  .nav button {
    background: var(--cp-accent); color: #fff; border: none; cursor: pointer;
    width: 34px; height: 34px; border-radius: 50%; font-size: 17px; line-height: 1;
  }
  .nav button:disabled { opacity: .35; cursor: default; }
  .nav .count { font-variant-numeric: tabular-nums; color: var(--cp-text-dim); font-size: 14px; min-width: 56px; text-align:center; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cp-border); cursor: pointer; }
  .dot.on { background: var(--cp-accent); }

  .topbar { position: fixed; top: 14px; right: 16px; z-index: 50; display:flex; gap:10px; }
  .topbar a, .topbar button {
    background: var(--cp-surface); border:1px solid var(--cp-border); color: var(--cp-text);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; text-decoration:none;
  }
  .footer-note { margin-top: auto; padding-top: 18px; color: var(--cp-text-dim); font-size: 12px; }
  .cover-wrap { justify-content: center; align-items: flex-start; }
  .cover-badge { font-size: clamp(13px,1.5vw,18px); color: var(--cp-text-dim); margin-bottom: 18px; }
  .pin { font-size: clamp(44px,8vw,90px); }
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html">← MVPに戻る</a>
  <button id="theme">🌓 テーマ</button>
</div>

<div id="deck"></div>

<div class="nav">
  <button id="prev">‹</button>
  <span class="count"><span id="cur">1</span> / <span id="tot">12</span></span>
  <button id="next">›</button>
  <span class="dots" id="dots"></span>
</div>

<script>

    {g:"S2 競争戦略", l:"競合・障壁", r:"△", c:"参入障壁は弱め。早期データ蓄積で堀を作る必要"},
    {g:"S3 仕組み（プロセス）", l:"プロダクト形態", r:"O", c:"アプリ単体で完結。導入容易"},

const deck = document.getElementById("deck");
deck.innerHTML = slides.join("");
const all = [...deck.querySelectorAll(".slide")];
const dotsWrap = document.getElementById("dots");
document.getElementById("tot").textContent = all.length;
all.forEach((_,i)=>{ const d=document.createElement("span"); d.className="dot"; d.onclick=()=>go(i); dotsWrap.appendChild(d); });
const dots = [...dotsWrap.children];
let idx = 0;
function go(n){
  idx = Math.max(0, Math.min(all.length-1, n));
  all.forEach((s,i)=>s.classList.toggle("active", i===idx));
  dots.forEach((d,i)=>d.classList.toggle("on", i===idx));
  document.getElementById("cur").textContent = idx+1;
  document.getElementById("prev").disabled = idx===0;
  document.getElementById("next").disabled = idx===all.length-1;
}
document.getElementById("prev").onclick=()=>go(idx-1);
document.getElementById("next").onclick=()=>go(idx+1);
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" ") go(idx+1);
  if(e.key==="ArrowLeft") go(idx-1);
});
go(0);

// theme
const tb=document.getElementById("theme");
function applyTheme(t){ document.documentElement.setAttribute("data-theme",t); localStorage.setItem("yorisoi-theme",t); }
applyTheme(localStorage.getItem("yorisoi-theme") || (matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
tb.onclick=()=>applyTheme(document.documentElement.getAttribute("data-theme")==="light"?"dark":"light");
</script>
